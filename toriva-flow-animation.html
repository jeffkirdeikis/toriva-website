<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=930, initial-scale=1">
<title>Toriva — How It Works</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0A0A08;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'DM Mono', monospace;
  overflow: hidden;
}

.wrapper {
  width: 930px;
  height: 466px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card {
  width: 880px;
  height: 360px;
  background: linear-gradient(135deg, rgba(201,168,76,0.04) 0%, rgba(15,15,12,0.95) 50%, rgba(201,168,76,0.03) 100%);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 24px;
  position: relative;
  overflow: hidden;
}

/* Subtle grid texture */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* Input icons (left) */
.inputs {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.icon-card {
  width: 56px;
  height: 56px;
  background: rgba(15,15,12,0.9);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 30px rgba(201,168,76,0.04);
  position: relative;
  z-index: 2;
}

.icon-card svg {
  width: 26px;
  height: 26px;
}

/* Center hub */
.hub {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 180px;
  height: 140px;
  background: rgba(10,10,8,0.95);
  border: 1.5px solid rgba(201,168,76,0.25);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 2;
  box-shadow: 0 0 60px rgba(201,168,76,0.08), 0 8px 32px rgba(0,0,0,0.5);
}

.hub-badge {
  position: absolute;
  top: -12px;
  background: linear-gradient(135deg, #C9A84C, #E8C46A);
  color: #0A0A08;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  padding: 3px 14px;
  border-radius: 20px;
  text-transform: uppercase;
}

.hub-icon svg {
  width: 44px;
  height: 44px;
}

.hub-label {
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: #F2EDE6;
  letter-spacing: 0.05em;
}

/* Output icons (right) */
.outputs {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.output-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.output-card .icon-card {
  width: 56px;
  height: 56px;
}

.output-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: rgba(201,168,76,0.55);
  text-transform: uppercase;
  font-weight: 400;
}

/* Connection lines canvas */
.lines-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Bottom text */
.bottom-text {
  margin-top: 18px;
  text-align: center;
}

.bottom-headline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: #F2EDE6;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}

.bottom-sub {
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  font-weight: 300;
  color: rgba(201,168,76,0.6);
  line-height: 1.6;
}

.bottom-sub strong {
  color: #C9A84C;
  font-weight: 400;
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <canvas class="lines-canvas" id="linesCanvas"></canvas>

    <!-- LEFT: Business Inputs -->
    <div class="inputs">
      <!-- Stripe / Payments -->
      <div class="icon-card" data-idx="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
      </div>
      <!-- Storefront -->
      <div class="icon-card" data-idx="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l1.5-5h15L21 9"/>
          <path d="M3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/>
          <path d="M9 21V13h6v8"/>
          <path d="M3 9c0 1.1.9 2 2 2s2-.9 2-2"/>
          <path d="M7 9c0 1.1.9 2 2 2s2-.9 2-2"/>
          <path d="M11 9c0 1.1.9 2 2 2s2-.9 2-2"/>
          <path d="M15 9c0 1.1.9 2 2 2s2-.9 2-2"/>
        </svg>
      </div>
      <!-- Support / Chat -->
      <div class="icon-card" data-idx="2">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="8" y1="9" x2="16" y2="9"/>
          <line x1="8" y1="13" x2="13" y2="13"/>
        </svg>
      </div>
      <!-- Content / Pencil -->
      <div class="icon-card" data-idx="3">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
    </div>

    <!-- CENTER: Toriva Agent Hub -->
    <div class="hub">
      <div class="hub-badge">Toriva AI</div>
      <div class="hub-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <div class="hub-label">Toriva Agent</div>
    </div>

    <!-- RIGHT: Revenue Outputs -->
    <div class="outputs">
      <!-- Revenue -->
      <div class="output-card">
        <div class="icon-card" data-idx="4">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4CCA6E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span class="output-label">Revenue</span>
      </div>
      <!-- Mac Compute -->
      <div class="output-card">
        <div class="icon-card" data-idx="5">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4CC9C9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <span class="output-label">Compute</span>
      </div>
      <!-- Payouts -->
      <div class="output-card">
        <div class="icon-card" data-idx="6">
          <svg viewBox="0 0 24 24" fill="none" stroke="#E8C46A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/>
          </svg>
        </div>
        <span class="output-label">Payouts</span>
      </div>
    </div>
  </div>

  <!-- Bottom text -->
  <div class="bottom-text">
    <div class="bottom-headline">Real businesses — real revenue</div>
    <div class="bottom-sub"><strong>toriva.ai</strong> deploys AI agents that run businesses autonomously,<br>paying Mac contributors from real customer revenue.</div>
  </div>
</div>

<script>
const canvas = document.getElementById('linesCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();

// Positions (relative to card)
const cardRect = canvas.parentElement.getBoundingClientRect();
const W = cardRect.width, H = cardRect.height;

// Input icon centers (left side)
const inputPositions = [];
const inputCards = document.querySelectorAll('.inputs .icon-card');
inputCards.forEach(card => {
  const r = card.getBoundingClientRect();
  const cr = canvas.parentElement.getBoundingClientRect();
  inputPositions.push({
    x: r.left - cr.left + r.width / 2,
    y: r.top - cr.top + r.height / 2
  });
});

// Hub center
const hubEl = document.querySelector('.hub');
const hubRect = hubEl.getBoundingClientRect();
const hubCenter = {
  x: hubRect.left - cardRect.left + hubRect.width / 2,
  y: hubRect.top - cardRect.top + hubRect.height / 2
};
const hubLeft = hubRect.left - cardRect.left;
const hubRight = hubRect.left - cardRect.left + hubRect.width;

// Output icon centers (right side)
const outputPositions = [];
const outputCards = document.querySelectorAll('.outputs .icon-card');
outputCards.forEach(card => {
  const r = card.getBoundingClientRect();
  const cr = canvas.parentElement.getBoundingClientRect();
  outputPositions.push({
    x: r.left - cr.left + r.width / 2,
    y: r.top - cr.top + r.height / 2
  });
});

// Colors
const GOLD = '#C9A84C';
const GOLD_BRIGHT = '#E8C46A';
const CYAN = '#4CC9C9';
const GREEN = '#4CCA6E';

const inputColors = ['#E85D5D', '#E8A34C', '#4C8CE8', '#888'];
const outputColors = [GREEN, CYAN, GOLD_BRIGHT];

// Particles
const particles = [];
let time = 0;

function spawnInputParticle() {
  const idx = Math.floor(Math.random() * inputPositions.length);
  const from = inputPositions[idx];
  const to = { x: hubLeft - 4, y: hubCenter.y + (idx - 1.5) * 12 };
  particles.push({
    type: 'input',
    from: { ...from },
    to: { ...to },
    progress: 0,
    speed: 0.006 + Math.random() * 0.004,
    color: inputColors[idx],
    size: 4 + Math.random() * 2,
    idx
  });
}

function spawnOutputParticle() {
  const idx = Math.floor(Math.random() * outputPositions.length);
  const from = { x: hubRight + 4, y: hubCenter.y + (idx - 1) * 14 };
  const to = outputPositions[idx];
  particles.push({
    type: 'output',
    from: { ...from },
    to: { ...to },
    progress: 0,
    speed: 0.005 + Math.random() * 0.004,
    color: outputColors[idx],
    size: 4 + Math.random() * 2,
    idx
  });
}

// Draw dashed path
function drawDashedLine(x1, y1, x2, y2, color, alpha) {
  ctx.beginPath();
  ctx.setLineDash([4, 6]);
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color.replace(')', `,${alpha})`).replace('rgb', 'rgba').replace('#', '');
  // Convert hex to rgba
  const r = parseInt(color.slice(1,3), 16);
  const g = parseInt(color.slice(3,5), 16);
  const b = parseInt(color.slice(5,7), 16);
  ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawCurvedDash(x1, y1, x2, y2, color, alpha, curveDir) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2 + (curveDir || 0) * 20;

  ctx.beginPath();
  ctx.setLineDash([4, 6]);
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(mx, my, x2, y2);

  const r = parseInt(color.slice(1,3), 16);
  const g = parseInt(color.slice(3,5), 16);
  const b = parseInt(color.slice(5,7), 16);
  ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

function getPointOnQuadratic(x1, y1, cx, cy, x2, y2, t) {
  return {
    x: (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2,
    y: (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2
  };
}

function loop() {
  time += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Spawn particles
  if (Math.random() < 0.025) spawnInputParticle();
  if (Math.random() < 0.02) spawnOutputParticle();

  // Draw static dashed lines (inputs → hub)
  inputPositions.forEach((pos, i) => {
    const toX = hubLeft - 4;
    const toY = hubCenter.y + (i - 1.5) * 12;
    drawDashedLine(pos.x + 28, pos.y, toX, toY, GOLD, 0.1);
  });

  // Draw static dashed lines (hub → outputs)
  outputPositions.forEach((pos, i) => {
    const fromX = hubRight + 4;
    const fromY = hubCenter.y + (i - 1) * 14;
    drawDashedLine(fromX, fromY, pos.x - 28, pos.y, outputColors[i], 0.12);
  });

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.progress += p.speed;

    if (p.progress >= 1) {
      particles.splice(i, 1);
      continue;
    }

    // Interpolate position along line
    let startX, startY, endX, endY;
    if (p.type === 'input') {
      startX = p.from.x + 28;
      startY = p.from.y;
      endX = p.to.x;
      endY = p.to.y;
    } else {
      startX = p.from.x;
      startY = p.from.y;
      endX = p.to.x - 28;
      endY = p.to.y;
    }

    const cx = startX + (endX - startX) * p.progress;
    const cy = startY + (endY - startY) * p.progress;

    // Glow
    const glowR = p.size * 3;
    const cr = parseInt(p.color.slice(1,3), 16);
    const cg = parseInt(p.color.slice(3,5), 16);
    const cb = parseInt(p.color.slice(5,7), 16);

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grad.addColorStop(0, `rgba(${cr},${cg},${cb},0.35)`);
    grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Dot
    ctx.beginPath();
    ctx.arc(cx, cy, p.size * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }

  // Hub glow pulse
  const pulse = 0.06 + 0.03 * Math.sin(time * 1.5);
  const hubGrad = ctx.createRadialGradient(hubCenter.x, hubCenter.y, 0, hubCenter.x, hubCenter.y, 120);
  hubGrad.addColorStop(0, `rgba(201,168,76,${pulse})`);
  hubGrad.addColorStop(1, 'rgba(201,168,76,0)');
  ctx.beginPath();
  ctx.arc(hubCenter.x, hubCenter.y, 120, 0, Math.PI * 2);
  ctx.fillStyle = hubGrad;
  ctx.fill();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
